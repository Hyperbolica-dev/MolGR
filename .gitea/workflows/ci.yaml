          CHECK_URL="${SERVER_URL%/}/api/packages/${{ github.repository_owner }}/pypi/simple"
          "$HOME/.local/bin/uv" publish --publish-url "$PUBLISH_URL" --check-url "$CHECK_URL" dist/*.tar.gz
