name: Gitea CI/CD Workflow

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYPI_INDEX_URL: https://mirrors.zju.edu.cn/pypi/web/simple
  UV_INDEX: https://mirrors.zju.edu.cn/pypi/web/simple
  UV_DEFAULT_INDEX: https://mirrors.zju.edu.cn/pypi/web/simple
  PIP_INDEX_URL: https://mirrors.zju.edu.cn/pypi/web/simple
  PIP_DEFAULT_TIMEOUT: "120"
  SERVER_URL: ${{ vars.SERVER_URL }}
  HTTP_PROXY: http://10.72.200.48:7890
  HTTPS_PROXY: http://10.72.200.48:7890

jobs:
  lint:
    name: Lint (ubuntu-latest, Py 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: http://10.72.201.58:13000/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          python3 -m pip install --user --break-system-packages -i "$PYPI_INDEX_URL" uv || python3 -m pip install --user -i "$PYPI_INDEX_URL" uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version

      - name: Set up Python 3.11
        run: $HOME/.local/bin/uv python install 3.11

      - name: Install dependencies
        run: |
          "$HOME/.local/bin/uv" sync --python 3.11 --no-dev --no-install-project --index "$PYPI_INDEX_URL" --default-index "$PYPI_INDEX_URL"
          "$HOME/.local/bin/uv" pip install --python 3.11 ruff --index "$PYPI_INDEX_URL" --default-index "$PYPI_INDEX_URL"

      - name: Lint and format check
        run: |
          "$HOME/.local/bin/uv" run --no-sync --python 3.11 ruff check .
          "$HOME/.local/bin/uv" run --no-sync --python 3.11 ruff format --check .

  build-test-linux-matrix:
    name: Build/Test ubuntu-latest Py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: http://10.72.201.58:13000/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          python3 -m pip install --user --break-system-packages -i "$PYPI_INDEX_URL" uv || python3 -m pip install --user -i "$PYPI_INDEX_URL" uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version

      - name: Set up Python ${{ matrix.python-version }}
        run: $HOME/.local/bin/uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          "$HOME/.local/bin/uv" sync --python ${{ matrix.python-version }} --no-dev --no-install-project --index "$PYPI_INDEX_URL" --default-index "$PYPI_INDEX_URL"
          "$HOME/.local/bin/uv" pip install --python ${{ matrix.python-version }} pytest pytest-cov pybind11 scikit-build-core setuptools-scm typing-extensions --index "$PYPI_INDEX_URL" --default-index "$PYPI_INDEX_URL"

      - name: Ensure CMake available
        run: $HOME/.local/bin/uv pip install --python ${{ matrix.python-version }} "cmake>=3.15" --index "$PYPI_INDEX_URL" --default-index "$PYPI_INDEX_URL"

      - name: Build extension (editable install)
        run: $HOME/.local/bin/uv pip install -e . -v --no-build-isolation --python ${{ matrix.python-version }} --index "$PYPI_INDEX_URL" --default-index "$PYPI_INDEX_URL"

      - name: Compile smoke check
        run: $HOME/.local/bin/uv run --no-sync --python ${{ matrix.python-version }} python -c "import molgr; import molgr._core"

      - name: Run tests
        run: $HOME/.local/bin/uv run --no-sync --python ${{ matrix.python-version }} pytest

  build-internal-release-linux-x86_64-manylinux2014-wheels:
    name: Build internal Linux x86_64 manylinux2014 wheel (${{ matrix.python_abi }})
    needs: [lint, build-test-linux-matrix]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || (startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, 'rc') || contains(github.ref_name, '.dev'))))
    strategy:
      fail-fast: false
      matrix:
        python_abi: ["cp38", "cp39", "cp310", "cp311", "cp312"]

    steps:
      - name: Checkout code
        uses: http://10.72.201.58:13000/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate prerelease tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main:refs/remotes/origin/main --prune
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Prerelease tags must point to a commit reachable from origin/main."
            exit 1
          fi

      - name: Install build tools
        run: |
          python3 -m pip install --user -i "$PYPI_INDEX_URL" uv || python3 -m pip install --user --break-system-packages -i "$PYPI_INDEX_URL" uv
          USER_BIN="$(python3 -m site --user-base)/bin"
          echo "$USER_BIN" >> "$GITHUB_PATH"
          "$USER_BIN/uv" --version
          "$USER_BIN/uv" python install 3.11
          "$USER_BIN/uv" run --no-project --python 3.11 --with cibuildwheel==3.4.1 --index "$PYPI_INDEX_URL" --default-index "$PYPI_INDEX_URL" python -c "import importlib.metadata as m; print('cibuildwheel', m.version('cibuildwheel'))"

      - name: Build wheels via cibuildwheel
        env:
          CIBW_BUILD: ${{ matrix.python_abi }}-manylinux_*
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_ENVIRONMENT: >
            PIP_INDEX_URL=https://mirrors.zju.edu.cn/pypi/web/simple
            PIP_DEFAULT_TIMEOUT=120
            HTTP_PROXY=http://10.72.200.48:7890
            HTTPS_PROXY=http://10.72.200.48:7890
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair --exclude libopenbabel.so.7 -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python -c "import molgr; import molgr._core; from molgr.interface import xyz_to_rdmol"
        run: |
          "$(python3 -m site --user-base)/bin/uv" run --no-project --python 3.11 --with cibuildwheel==3.4.1 --index "$PYPI_INDEX_URL" --default-index "$PYPI_INDEX_URL" cibuildwheel --platform linux

      - name: Publish wheels to Gitea Registry
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.OWNER }}
          UV_PUBLISH_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          if [ -z "${SERVER_URL}" ]; then
            echo "SERVER_URL is empty. Set repository variable SERVER_URL, for example: https://gitea.example.com:13000."
            exit 1
          fi
          PUBLISH_URL="${SERVER_URL%/}/api/packages/${{ github.repository_owner }}/pypi"
          CHECK_URL="${SERVER_URL%/}/api/packages/${{ github.repository_owner }}/pypi/simple"
          "$(python3 -m site --user-base)/bin/uv" publish --publish-url "$PUBLISH_URL" --check-url "$CHECK_URL" wheelhouse/*.whl

