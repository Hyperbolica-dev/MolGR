[project]
name = "molgr"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
]
dependencies = [
    "rdkit>=2023.9.6",
    "openbabel-wheel; python_version < '3.10'",
    "openbabel>=3.2.0; python_version >= '3.10'",
    "numpy<2; python_version == '3.8'",
    "numpy>=1.26,<2; python_version == '3.9'",
    "numpy>=1.26,<2.3; python_version >= '3.10' and python_version < '3.13'",
    "numpy>=1.26; python_version >= '3.13'",
    "typing-extensions>=4.13.2",
]

[build-system]
requires = ["scikit-build-core>=0.10", "setuptools-scm", "pybind11", "openbabel-wheel"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/molgr"]

# ✅ 这是官方原生支持的 Provider
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

# 生成 _version.py (包含在 sdist 中)
sdist.include = ["src/molgr/_version.py"]

[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets",
    "mypy",
    "pandas>=2.0.3; python_version < '3.12'",
    "pandas>=2.2; python_version >= '3.12'",
    "pybind11>=3.0.1",
    "py-spy>=0.3.14",
    "pytest",
    "pytest-cov",
    "rich",
    "ruff",
    "scikit-build-core>=0.11.6",
    "scipy>=1.10.1",
    "setuptools-scm>=9.2.2",
    "jinja2",
    "pybind11-stubgen>=2.5.5",
    "rdkit-dof>=0.2.1",
]

[tool.ruff]
exclude = [".git", ".venv", "__pycache__", "build", "dist"]
line-length = 100
indent-width = 4
target-version = "py38"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort 
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions 
    "UP",  # pyupgrade 
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long 
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "UP045", # don't suggest X | None on py38
    "UP006",
    "UP007", 
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]


[tool.mypy]
warn_return_any = false       # 允许函数返回 Any (这对调用未加类型的第三方库很有用)
warn_unused_configs = true    # 警告无用的配置
explicit_package_bases = true # 配合 src 目录结构

disallow_untyped_defs = false # 关键！允许编写没有类型注解的函数
disallow_any_generics = false # 允许使用 List, Dict 而不必须写 List[int]

check_untyped_defs = true   # 关键！即使函数没写注解，也要检查函数内部的逻辑错误
no_implicit_optional = true # 禁止隐式的 Optional (即禁止 x: str = None)
warn_redundant_casts = true # 警告多余的 cast
warn_unused_ignores = false # 警告多余的 # type: ignore

ignore_missing_imports = true
no_site_packages = true
exclude = "^(tests/|scripts/|build/|dist/|src/molgr/_core/)"


[[tool.uv.index]]
name = "pypi"
url = "https://mirrors.zju.edu.cn/pypi/web/simple"
