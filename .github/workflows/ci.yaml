name: Build, Test, and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [published]

jobs:
  lint:
    name: Lint (ubuntu-latest, Py 3.11)
    runs-on: ubuntu-latest
    env:
      UV_INDEX: https://pypi.org/simple
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv (GitHub)
        if: ${{ env.ACT != 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install uv (act)
        if: ${{ env.ACT == 'true' }}
        run: |
          python3 -m pip install --user --break-system-packages uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --python 3.11 --no-dev --no-install-project --index https://pypi.org/simple --default-index https://pypi.org/simple
          uv pip install --python 3.11 ruff --index https://pypi.org/simple --default-index https://pypi.org/simple

      - name: Lint and format check
        run: |
          uv run --no-sync --python 3.11 ruff check .
          uv run --no-sync --python 3.11 ruff format --check .

  get-metadata:
    runs-on: ubuntu-latest
    outputs:
      pkg_name: ${{ steps.package_name.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - name: Extract package name
        id: package_name
        run: |
          NAME=$(grep -m 1 '^name =' pyproject.toml | cut -d '"' -f 2)
          echo "value=$NAME" >> $GITHUB_OUTPUT

  build-and-test:
    name: Build and test on ${{ matrix.os }} (Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      UV_INDEX: https://pypi.org/simple
      UV_DEFAULT_INDEX: https://pypi.org/simple
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv (GitHub)
        if: ${{ env.ACT != 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install uv (act)
        if: ${{ env.ACT == 'true' }}
        run: |
          python3 -m pip install --user --break-system-packages uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --python ${{ matrix.python-version }} --no-dev --no-install-project --index https://pypi.org/simple --default-index https://pypi.org/simple
          uv pip install --python ${{ matrix.python-version }} pytest pytest-cov pybind11 scikit-build-core setuptools-scm typing-extensions --index https://pypi.org/simple --default-index https://pypi.org/simple

      - name: Ensure CMake available
        run: uv pip install --python ${{ matrix.python-version }} "cmake>=3.15" --index https://pypi.org/simple --default-index https://pypi.org/simple

      - name: Build extension (editable install)
        run: uv pip install -e . -v --no-build-isolation --python ${{ matrix.python-version }} --index https://pypi.org/simple --default-index https://pypi.org/simple

      - name: Compile smoke check
        run: |
          uv run --no-sync --python ${{ matrix.python-version }} python -c "import molgr; import molgr._core"

      - name: Run tests
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest

  build-release-wheels:
    name: Build release wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false && github.event.release.target_commitish == 'main' && startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, 'rc') && !contains(github.event.release.tag_name, '.dev')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-manylinux2014
            os: ubuntu-latest
            build: "cp38-manylinux_* cp39-manylinux_* cp310-manylinux_* cp311-manylinux_* cp312-manylinux_*"
            archs_linux: "x86_64 aarch64"
            manylinux_x86_64_image: manylinux2014
            manylinux_aarch64_image: manylinux2014
          - target: linux-manylinux_2_28
            os: ubuntu-latest
            build: "cp313-manylinux_* cp314-manylinux_*"
            archs_linux: "x86_64 aarch64"
            manylinux_x86_64_image: manylinux_2_28
            manylinux_aarch64_image: manylinux_2_28
          - target: windows-amd64
            os: windows-latest
            build: "cp38-win_amd64 cp39-win_amd64 cp310-win_amd64 cp311-win_amd64 cp312-win_amd64 cp313-win_amd64 cp314-win_amd64"
            archs_linux: auto
            manylinux_x86_64_image: manylinux2014
            manylinux_aarch64_image: manylinux2014
          - target: macos-x86_64
            os: macos-13
            build: "cp38-macosx_x86_64 cp39-macosx_x86_64 cp310-macosx_x86_64 cp311-macosx_x86_64 cp312-macosx_x86_64 cp313-macosx_x86_64 cp314-macosx_x86_64"
            archs_linux: auto
            manylinux_x86_64_image: manylinux2014
            manylinux_aarch64_image: manylinux2014
          - target: macos-arm64
            os: macos-14
            build: "cp38-macosx_arm64 cp39-macosx_arm64 cp310-macosx_arm64 cp311-macosx_arm64 cp312-macosx_arm64 cp313-macosx_arm64 cp314-macosx_arm64"
            archs_linux: auto
            manylinux_x86_64_image: manylinux2014
            manylinux_aarch64_image: manylinux2014

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up QEMU for Linux aarch64
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Python 3.11 (GitHub)
        if: ${{ env.ACT != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels via cibuildwheel (GitHub)
        if: ${{ env.ACT != 'true' }}
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS_LINUX: ${{ matrix.archs_linux }}
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: native
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_x86_64_image }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.manylinux_aarch64_image }}
          CIBW_ENVIRONMENT: >
            PIP_INDEX_URL=https://mirrors.zju.edu.cn/pypi/web/simple
            PIP_DEFAULT_TIMEOUT=120
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair --exclude libopenbabel.so.7 -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python -c "import molgr; import molgr._core; from molgr.interface import xyz_to_rdmol"

      - name: Build wheels via cibuildwheel (act)
        if: ${{ env.ACT == 'true' }}
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS_LINUX: ${{ matrix.archs_linux }}
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: native
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_x86_64_image }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.manylinux_aarch64_image }}
          CIBW_ENVIRONMENT: >
            PIP_INDEX_URL=https://mirrors.zju.edu.cn/pypi/web/simple
            PIP_DEFAULT_TIMEOUT=120
            HTTP_PROXY=http://10.72.200.48:7890
            HTTPS_PROXY=http://10.72.200.48:7890
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair --exclude libopenbabel.so.7 -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python -c "import molgr; import molgr._core; from molgr.interface import xyz_to_rdmol"
        run: |
          python3 -m pip install --user --break-system-packages -i https://mirrors.zju.edu.cn/pypi/web/simple cibuildwheel==3.4.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cibuildwheel"

      - name: Upload release wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ matrix.target }}
          path: wheelhouse/*.whl
        
  deploy:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    env:
      UV_INDEX: https://pypi.org/simple
      UV_DEFAULT_INDEX: https://pypi.org/simple
    needs: [build-and-test, build-release-wheels, get-metadata]
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false && github.event.release.target_commitish == 'main' && startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, 'rc') && !contains(github.event.release.tag_name, '.dev')

    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.get-metadata.outputs.pkg_name }}

    permissions:
      id-token: write # 用于 PyPI Trusted Publishing
      contents: write # 💡 必须：用于将构建产物上传到 GitHub Release 页面

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download release wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-wheel-*
          merge-multiple: true
          path: dist

      - name: Build sdist
        run: uv build --sdist --out-dir dist

      - name: Show distributions
        run: ls -lah dist

      - name: Publish to PyPI
        run: uv publish

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
