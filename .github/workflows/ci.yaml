name: Build, Test, and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [published]

jobs:
  lint:
    name: Lint (ubuntu-latest, Py 3.11)
    runs-on: ubuntu-latest
    env:
      UV_INDEX: https://pypi.org/simple
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv (GitHub)
        if: ${{ env.ACT != 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install uv (act)
        if: ${{ env.ACT == 'true' }}
        run: |
          python3 -m pip install --user --break-system-packages uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --python 3.11 --no-dev --no-install-project --index https://pypi.org/simple --default-index https://pypi.org/simple
          uv pip install --python 3.11 ruff --index https://pypi.org/simple --default-index https://pypi.org/simple

      - name: Lint and format check
        run: |
          uv run --no-sync --python 3.11 ruff check .
          uv run --no-sync --python 3.11 ruff format --check .

  get-metadata:
    runs-on: ubuntu-latest
    outputs:
      pkg_name: ${{ steps.package_name.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - name: Extract package name
        id: package_name
        run: |
          NAME=$(grep -m 1 '^name =' pyproject.toml | cut -d '"' -f 2)
          echo "value=$NAME" >> $GITHUB_OUTPUT

  build-and-test:
    name: Build and test on ${{ matrix.os }} (Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      UV_INDEX: https://pypi.org/simple
      UV_DEFAULT_INDEX: https://pypi.org/simple
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv (GitHub)
        if: ${{ env.ACT != 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install uv (act)
        if: ${{ env.ACT == 'true' }}
        run: |
          python3 -m pip install --user --break-system-packages uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --python ${{ matrix.python-version }} --no-dev --no-install-project --index https://pypi.org/simple --default-index https://pypi.org/simple
          uv pip install --python ${{ matrix.python-version }} pytest pytest-cov pybind11 scikit-build-core setuptools-scm typing-extensions --index https://pypi.org/simple --default-index https://pypi.org/simple

      - name: Ensure CMake available
        run: uv pip install --python ${{ matrix.python-version }} "cmake>=3.15" --index https://pypi.org/simple --default-index https://pypi.org/simple

      - name: Build extension (editable install)
        run: uv pip install -e . -v --no-build-isolation --python ${{ matrix.python-version }} --index https://pypi.org/simple --default-index https://pypi.org/simple

      - name: Compile smoke check
        run: |
          uv run --no-sync --python ${{ matrix.python-version }} python -c "import molgr; import molgr._core"

      - name: Run tests
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest

  build-release-wheels:
    name: Build release wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false && github.event.release.target_commitish == 'main' && startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, 'rc') && !contains(github.event.release.tag_name, '.dev')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: native
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD_VERBOSITY: "1"

      - name: Upload release wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
        
  deploy:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    env:
      UV_INDEX: https://pypi.org/simple
      UV_DEFAULT_INDEX: https://pypi.org/simple
    needs: [build-and-test, build-release-wheels, get-metadata]
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false && github.event.release.target_commitish == 'main' && startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, 'rc') && !contains(github.event.release.tag_name, '.dev')

    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.get-metadata.outputs.pkg_name }}

    permissions:
      id-token: write # 用于 PyPI Trusted Publishing
      contents: write # 💡 必须：用于将构建产物上传到 GitHub Release 页面

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download release wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-wheel-*
          merge-multiple: true
          path: dist

      - name: Build sdist
        run: uv build --sdist --out-dir dist

      - name: Show distributions
        run: ls -lah dist

      - name: Publish to PyPI
        run: uv publish

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
