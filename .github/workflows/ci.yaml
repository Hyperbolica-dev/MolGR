name: Build, Test, and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  get-metadata:
    runs-on: ubuntu-latest
    outputs:
      pkg_name: ${{ steps.package_name.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - name: Extract package name
        id: package_name
        run: |
          NAME=$(grep -m 1 '^name =' pyproject.toml | cut -d '"' -f 2)
          echo "value=$NAME" >> $GITHUB_OUTPUT

  build-and-test:
    name: Test on ${{ matrix.os }} (Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5 
        with:
          enable-cache: true
          cache-suffix: ${{ runner.os }}-${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint and Format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest
          
  docker-check:
    name: Check Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test # 测试通过后再构建镜像
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker Image
        # 仅仅尝试构建，确保 Dockerfile 没写错
        run: docker build .

  deploy:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    needs: [build-and-test, get-metadata]
    if: github.event_name == 'release' && github.event.action == 'published'

    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.get-metadata.outputs.pkg_name }}

    permissions:
      id-token: write # 用于 PyPI Trusted Publishing
      contents: write # 💡 必须：用于将构建产物上传到 GitHub Release 页面

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
